# Isolated vhost for tank.damerchi.ir only.
# Enable as /etc/nginx/sites-available/tank.damerchi.ir
# Do not replace nginx.conf or other site files.

server {
    listen 80;
    listen [::]:80;
    server_name tank.damerchi.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tank.damerchi.ir;

    ssl_certificate     /etc/letsencrypt/live/tank.damerchi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tank.damerchi.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:17480;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
