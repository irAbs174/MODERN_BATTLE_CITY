services:
  web:
    build: .
    image: tankforge:latest
    container_name: tankforge
    restart: unless-stopped
    ports:
      - "127.0.0.1:17480:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
